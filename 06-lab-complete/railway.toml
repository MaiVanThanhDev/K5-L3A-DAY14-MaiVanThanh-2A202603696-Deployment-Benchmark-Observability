# Railway — build bằng Dockerfile, health check /health.
# App lắng nghe theo biến PORT do Railway cấp (xử lý trong CMD của Dockerfile).
# Secret (AGENT_API_KEY) và REDIS_URL đặt trong Railway → Variables, không ghi ở đây.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
